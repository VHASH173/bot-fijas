<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            width: 400px;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        .ticket-container {
            background: #1e1e1e;
            border-radius: 12px;
            border: 2px solid #00e676;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.2);
        }
        .header {
            text-align: center;
            border-bottom: 1px dashed #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header h2 {
            margin: 0;
            color: #00e676;
            font-size: 24px;
            text-transform: uppercase;
        }
        .match-info {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }
        .league-info {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-bottom: 15px;
        }
        .prediction-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .market {
            font-size: 14px;
            color: #ccc;
        }
        .pick {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }
        .odds {
            float: right;
            color: #00e676;
            font-size: 22px;
            font-weight: bold;
        }
        .footer {
            border-top: 1px dashed #444;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
        }
        .stake-info span {
            display: block;
        }
        .label {
            font-size: 12px;
            color: #888;
        }
        .value {
            font-size: 16px;
            font-weight: bold;
        }
        .watermark {
            text-align: center;
            margin-top: 15px;
            font-size: 10px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="ticket-container">
        <div class="header">
            <h2>APUESTA CONFIRMADA</h2>
        </div>
        <div class="league-info">{{ .Liga }}</div>
        <div class="match-info">{{ .Local }} vs {{ .Visita }}</div>

        <div class="prediction-box">
            <span class="odds">{{ .Cuota }}</span>
            <div class="market">Mercado: {{ .Mercado }}</div>
            <div class="pick">Pronóstico: {{ .Pronostico }}</div>
        </div>

        <div class="footer">
            <div class="stake-info">
                <span class="label">Stake Recomendado</span>
                <span class="value">{{ .Stake }}/10</span>
            </div>
            <div class="stake-info" style="text-align: right;">
                <span class="label">Estado</span>
                <span class="value" style="color: #00e676;">PENDIENTE ⏳</span>
            </div>
        </div>
        <div class="watermark">Generado por el Sistema VIP de Análisis Cuántico</div>
    </div>
</body>
</html>
